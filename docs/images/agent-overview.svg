<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-labelledby="title desc" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="title">How Trip Journal Agent works</title>
  <desc id="desc">Trip JSON is imported into SQLite. The agent exchanges requests and results with read-only tools and a local Ollama model. For up to eight steps, the model picks a tool, the app validates and runs it, and the result goes back to the model. A grounding check precedes organized notes, a cited daily journal and trip answers. An optional cached OpenStreetMap lookup is shown outside the laptop.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="m0 0 8 4-8 4 2-4Z" fill="#495057"/>
    </marker>
    <marker id="loop-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4" markerHeight="4" orient="auto">
      <path d="m0 0 8 4-8 4 2-4Z" fill="#7048E8"/>
    </marker>
  </defs>
  <rect width="1200" height="680" rx="24" fill="#F8F9FA"/>
  <text x="40" y="59" fill="#0B3B66" font-size="38" font-weight="700" letter-spacing="-1">How Trip Journal Agent works</text>
  <rect x="23" y="90" width="1154" height="455" rx="22" fill="#FFFFFF" stroke="#868E96" stroke-width="2" stroke-dasharray="8 6"/>
  <g transform="translate(47 118)" fill="none" stroke="#343A40" stroke-width="2">
    <rect width="25" height="16" rx="2"/><path d="m0 17-4 4h33l-4-4"/>
  </g>
  <text x="86" y="135" fill="#343A40" font-size="19" font-weight="600">Runs locally on the laptop — trip data never leaves it</text>
  <!-- Main flow, including two-way communication with the tools and model -->
  <g fill="none" stroke="#495057" stroke-width="2.3" marker-end="url(#arrow)">
    <path d="M187 332h23"/><path d="M352 332h23"/>
    <path d="M560 332h30" marker-start="url(#arrow)"/>
    <path d="M704 240v-25" marker-start="url(#arrow)"/>
    <path d="M812 332h22"/>
    <path d="M965 332h28"/>
    <path d="M979 332v-81q0-7 7-7h7"/>
    <path d="M979 332v81q0 7 7 7h7"/>
    <path d="M466 454v136" stroke-dasharray="5 6"/>
  </g>
  <!-- Import -->
  <g text-anchor="middle">
    <rect x="42" y="241" width="144" height="180" rx="14" fill="#FFE8CC" stroke="#F08C00" stroke-width="2"/>
    <g transform="translate(98 257)" fill="none" stroke="#5C3A00" stroke-width="2" stroke-linejoin="round">
      <path d="M0 0h21l10 10v27H0Z" fill="#FFF8EF"/><path d="M21 0v10h10M8 19h15M8 26h11"/>
    </g>
    <g fill="#5C3A00">
      <text x="114" y="324" font-size="21" font-weight="700">Trip records</text>
      <text x="114" y="350" font-size="17" font-weight="600">JSON</text>
      <text x="114" y="380" font-size="16">Stops · Notes</text>
      <text x="114" y="402" font-size="16">Photo metadata</text>
    </g>
    <rect x="213" y="264" width="138" height="136" rx="14" fill="#D0EBFF" stroke="#1971C2" stroke-width="2"/>
    <g transform="translate(282 284)" fill="#F3FAFF" stroke="#0B3B66" stroke-width="2">
      <path d="M-16 0v24c0 8 32 8 32 0V0Z"/><ellipse rx="16" ry="5.5"/><path d="M-16 12c0 8 32 8 32 0" fill="none"/>
    </g>
    <g fill="#0B3B66" font-size="21" font-weight="700">
      <text x="282" y="347">Import +</text><text x="282" y="375">SQLite</text>
    </g>
  </g>
  <!-- Read-only tool catalog -->
  <rect x="378" y="211" width="179" height="242" rx="14" fill="#D0EBFF" stroke="#1971C2" stroke-width="2"/>
  <g fill="#0B3B66">
    <text x="395" y="246" font-size="23" font-weight="700">Tool layer</text>
    <text x="395" y="272" font-size="17">Read-only queries</text>
    <path d="M395 288h145" stroke="#1971C2" opacity=".45"/>
    <g font-size="17">
      <text x="395" y="315">list_day_stops</text><text x="395" y="344">get_stop_notes</text>
      <text x="395" y="373">find_photos</text><text x="395" y="402">search_notes</text>
      <text x="395" y="431">lookup_place</text>
    </g>
  </g>
  <!-- Model and agent cycle -->
  <rect x="596" y="151" width="216" height="60" rx="14" fill="#E5DBFF" stroke="#7048E8" stroke-width="2"/>
  <g text-anchor="middle" fill="#2B1A66">
    <text x="704" y="177" font-size="21" font-weight="700">Local LLM</text>
    <text x="704" y="199" font-size="17">Ollama · qwen3:8b</text>
  </g>
  <rect x="594" y="244" width="217" height="262" rx="14" fill="#E5DBFF" stroke="#7048E8" stroke-width="2"/>
  <g fill="#2B1A66">
    <text x="613" y="277" font-size="23" font-weight="700">Agent loop</text>
    <text x="613" y="303" font-size="17">Max 8 steps</text>
  </g>
  <g fill="none" stroke="#7048E8" stroke-width="2" marker-end="url(#loop-arrow)">
    <path d="M689 353v18"/><path d="M689 422v18"/>
    <path d="M764 462h15q8 0 8-8V345q0-8-8-8h-13"/>
  </g>
  <g fill="#FAF8FF" stroke="#B197FC" stroke-width="1.5">
    <rect x="609" y="321" width="155" height="32" rx="8"/>
    <rect x="609" y="374" width="155" height="48" rx="8"/>
    <rect x="609" y="444" width="155" height="37" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#2B1A66" font-size="16" font-weight="600">
    <text x="686" y="343">LLM picks a tool</text>
    <text x="686" y="394">App validates</text><text x="686" y="414">and runs it</text>
    <text x="686" y="468">Result goes back</text>
  </g>
  <!-- Citation check and outputs -->
  <rect x="837" y="264" width="127" height="136" rx="14" fill="#D0EBFF" stroke="#1971C2" stroke-width="2"/>
  <g transform="translate(901 297)" fill="none" stroke="#0B3B66" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle r="15" fill="#F3FAFF"/><path d="m-7 0 5 5 9-10"/>
  </g>
  <g text-anchor="middle" fill="#0B3B66" font-size="20" font-weight="700">
    <text x="901" y="347">Grounding</text><text x="901" y="375">check</text>
  </g>
  <g fill="#D3F9D8" stroke="#2F9E44" stroke-width="2">
    <rect x="997" y="214" width="160" height="60" rx="13"/>
    <rect x="997" y="296" width="160" height="72" rx="13"/>
    <rect x="997" y="390" width="160" height="60" rx="13"/>
  </g>
  <g text-anchor="middle" fill="#0B4019" font-size="18" font-weight="700">
    <text x="1077" y="250">Organized notes</text>
    <text x="1077" y="328">Daily journal</text><text x="1077" y="351" font-size="17" font-weight="400">with citations</text>
    <text x="1077" y="426">Trip Q&amp;A</text>
  </g>
  <rect x="327" y="594" width="279" height="68" rx="14" fill="#F1F3F5" stroke="#868E96" stroke-width="2" stroke-dasharray="6 5"/>
  <g text-anchor="middle" fill="#343A40">
    <text x="466" y="621" font-size="19" font-weight="700">Optional place lookup</text>
    <text x="466" y="647" font-size="17">OpenStreetMap, cached</text>
  </g>
</svg>
