# ADDED [PROMPT #13]: U1 Foundation project config (AI-assisted, Claude Opus 5.5).
[project]
name = "trip-journal-agent"
version = "0.1.0"
description = "Local trip journal agent: grounded day journals and Q&A from trip notes, using a local Ollama model."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.29.0",
    "jinja2>=3.1.6",
    "openai>=3.60.0",
    "pydantic>=2.14.4",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54.0",
]

[project.scripts]
trip-journal = "trip_journal.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trip_journal"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["trip_journal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["trip_journal"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]
